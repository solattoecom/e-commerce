.entry-pending .card,

.entry-pending #h1,.entry-pending #sub{transform:translateY(10px);}

.entry-pending .divider,.entry-pending #gBtn,.entry-pending #bottom{transform:translateY(8px);}

            <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>
            <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/>
            <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/>
            <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.18 1.48-4.97 2.35-8.16 2.35-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>

          <span class="g-text">Entrar com Google</span>

        <p id="bottom">Não tem uma conta?&nbsp;<a href="#">Criar conta</a></p>

      </div>

<!-- ── LAYOUT ENGINE ──────────────────────────────────────────────── -->
<script>
(function(){
'use strict';
var REF_W=1464,PANE_W=628,CARD_W=613;
var CONTENT_H=697;
var IMG_W=1177,IMG_H=1336,IMG_REF_SCALE=836/1177;
var PANE_RATIO=PANE_W/REF_W;
var HERO_W=681;
var REF_CARD_ASPECT=692/855;
var RAMP_HI=1280,RAMP_LO=1000,PHOTO_MIN=0.42;
var RAMP_LO2=820,PHOTO_MIN2=0.36;
var TP={
  pad:0.1076,h1Top:0.08656,h1Fs:0.06839,subTop:0.17368,subFs:0.0309,
  emTop:0.25435,emH:0.10257,emR:0.0202,ephFs:0.02702,ephPad:0.0332,
  pwTop:0.36851,pwH:0.10839,btnTop:0.50435,btnH:0.10981,btnFs:0.0275,
  arrow:0.026,btnGap:0.02,divTop:0.68222,orFs:0.02245,orPad:0.051,
  divH:0.0026,gTop:0.76445,gH:0.09966,gIcon:0.032,gtFs:0.03205,
  gGap:0.026,btTop:0.89668,btFs:0.02876,heroFs:0.1058,
  badgeH:0.0742,heroLh:1.1246,heroBot:0.06493,heroGap:-0.30423,heroSide:0.0525
};

var mqLandscape=window.matchMedia('(min-width:700px) and (min-aspect-ratio:51/50)');
var mqPortrait=window.matchMedia('(min-width:700px) and (max-aspect-ratio:51/50)');

var photo=document.querySelector('.photo');
var pane=document.querySelector('.pane');
var card=document.getElementById('card');
var cardIn=document.getElementById('cardIn');
var hero=document.getElementById('hero');
var badge=document.querySelector('.badge');
var root=document.documentElement;

function clearInline(){
  [photo,pane,card,cardIn,hero,badge].forEach(function(el){
    if(el)el.style.cssText='';
  });
  ['--band-h','--tp-side','--tp-bot','--tp-pad',
   '--tp-h1-fs','--tp-sub-fs','--tp-em-h','--tp-pw-h',
   '--tp-btn-h','--tp-btn-fs','--tp-g-h','--tp-gt-fs',
   '--tp-bt-fs','--tp-g-icon','--tp-hl-fs','--tp-hero-bot'
  ].forEach(function(v){root.style.removeProperty(v);});
}

function setMode(m){
  document.body.classList.remove('tabport','stacked');
  if(m==='tabport')document.body.classList.add('tabport');
  if(m==='phone')document.body.classList.add('stacked');
}

function photoRatio(vw){
  if(vw>=RAMP_HI)return 1-PANE_RATIO;
  if(vw>=RAMP_LO){
    var t=(vw-RAMP_LO)/(RAMP_HI-RAMP_LO);
    return PHOTO_MIN+t*((1-PANE_RATIO)-PHOTO_MIN);
  }
  if(vw>=RAMP_LO2){
    var t2=(vw-RAMP_LO2)/(RAMP_LO-RAMP_LO2);
    return PHOTO_MIN2+t2*(PHOTO_MIN-PHOTO_MIN2);
  }
  return PHOTO_MIN2;
}

function placeCard(paneW,vh){
  var cs=Math.min(paneW/PANE_W,vh/CONTENT_H);
  var gapL=1*cs,mT=14*cs,mB=13*cs,mR=14*cs;
  var cw=Math.max(CARD_W*cs,paneW-gapL-mR);
  var ch=vh-mT-mB;
  card.style.left=gapL+'px';
  card.style.top=mT+'px';
  card.style.width=cw+'px';
  card.style.height=ch+'px';
  card.style.borderRadius=(26*cs)+'px';
  card.style.borderWidth=Math.max(1,cs)+'px';
  cardIn.style.transform='translate('+((cw-CARD_W*cs)/2)+'px,0) scale('+cs+')';
}

function seatHero(photoW,vh){
  var imgScale=Math.max(photoW/IMG_W,vh/IMG_H);
  var s=Math.min(imgScale/IMG_REF_SCALE,photoW*0.92/HERO_W);
  hero.style.transform='scale('+s+')';
}

function layoutLand(){
  var vw=window.innerWidth,vh=window.innerHeight;
  var pr=photoRatio(vw);
  var photoW=Math.round(vw*pr);
  var paneW=vw-photoW;
  photo.style.width=photoW+'px';
  pane.style.left=photoW+'px';
  placeCard(paneW,vh);
  seatHero(photoW,vh);
}

function layoutTabport(){
  var vw=window.innerWidth,vh=window.innerHeight;
  var side=Math.round(vw*TP.heroSide);
  var bandH=Math.round(vh*0.425);
  var footerH=Math.round(vh*0.0297);
  var cardH=vh-bandH;
  var S=Math.min(cardH,vw*REF_CARD_ASPECT);

  root.style.setProperty('--band-h',bandH+'px');
  root.style.setProperty('--tp-side',side+'px');
  root.style.setProperty('--tp-bot',footerH+'px');
  root.style.setProperty('--tp-pad',Math.round(S*TP.pad)+'px');
  root.style.setProperty('--tp-h1-fs',(S*TP.h1Fs)+'px');
  root.style.setProperty('--tp-sub-fs',(S*TP.subFs)+'px');
  root.style.setProperty('--tp-em-h',(S*TP.emH)+'px');
  root.style.setProperty('--tp-pw-h',(S*TP.pwH)+'px');
  root.style.setProperty('--tp-btn-h',(S*TP.btnH)+'px');
  root.style.setProperty('--tp-btn-fs',(S*TP.btnFs)+'px');
  root.style.setProperty('--tp-g-h',(S*TP.gH)+'px');
  root.style.setProperty('--tp-gt-fs',(S*TP.gtFs)+'px');
  root.style.setProperty('--tp-bt-fs',(S*TP.btFs)+'px');
  root.style.setProperty('--tp-g-icon',(S*TP.gIcon)+'px');
  root.style.setProperty('--tp-hl-fs',Math.round(bandH*TP.heroFs)+'px');
  root.style.setProperty('--tp-hero-bot',Math.round(bandH*TP.heroBot)+'px');

  photo.style.width='100%';
  photo.style.height=bandH+'px';
  pane.style.left='0';pane.style.right='0';
  pane.style.top=bandH+'px';pane.style.bottom='0';

  // Badge scale
  var badgeK=bandH*TP.badgeH/37;
  badge.style.transform='scale('+badgeK+')';
  badge.style.transformOrigin='left bottom';

  // Hero position
  hero.style.bottom=Math.round(bandH*TP.heroBot)+'px';
  hero.style.left=side+'px';
}

function layout(){
  clearInline();
  var vw=window.innerWidth;
  if(vw<700){setMode('phone');return;}
  if(mqLandscape.matches){setMode('land');layoutLand();}
  else if(mqPortrait.matches){setMode('tabport');layoutTabport();}
  else{setMode('phone');}
}

window.addEventListener('resize',layout,{passive:true});
window.addEventListener('orientationchange',layout);
mqLandscape.addEventListener('change',layout);
mqPortrait.addEventListener('change',layout);
document.fonts.ready.then(layout);
layout();
})();
</script>

<!-- ── ENTRANCE ANIMATION ─────────────────────────────────────────── -->
<script>
(function(){
'use strict';
if(window.matchMedia('(prefers-reduced-motion:reduce)').matches||!Element.prototype.animate){
  document.documentElement.classList.remove('entry-pending');
  clearTimeout(window.__entryFallback);
  return;
}

var ease='cubic-bezier(.16,1,.3,1)';
var softEase='cubic-bezier(.22,1,.36,1)';
var compact=window.matchMedia('(max-width:699px)').matches;
var animations=[];

function releaseEntrance(){
  clearTimeout(window.__entryFallback);
  animations.forEach(function(a){try{a.cancel();}catch(e){}});
  animations=[];
}

function anim(el,from,to,delay,duration,easing){
  if(!el)return null;
  var a=el.animate([from,to],{delay:delay,duration:duration,easing:easing,fill:'both'});
  animations.push(a);
  return a;
}

function start(){
  document.documentElement.classList.remove('entry-pending');

  var $=function(id){return document.getElementById(id);};
  var card=$('card'),badge=document.querySelector('.badge');
  var hl1=$('hl1'),hl2=$('hl2'),h1=$('h1'),sub=$('sub');
  var email=$('email'),pw=$('pw'),loginBtn=$('loginBtn');
  var divider=document.querySelector('.divider');
  var gBtn=$('gBtn'),bottom=$('bottom');

  var to={opacity:'1',transform:'none'};
  var toClip={opacity:'1',transform:'none',clipPath:'inset(0 0 0 0)'};
  var dy=compact?12:16;

  anim(card,
    {opacity:'0',transform:compact?'translateY(14px)':'translateY(12px) scale(.988)'},
    to,40,820,ease);
  anim(badge,
    {opacity:'0',transform:'translateY(8px)'},
    to,120,480,softEase);
  anim(hl1,
    {opacity:'0',transform:'translateY('+dy+'px)',clipPath:'inset(100% 0 0 0)'},
    toClip,240,760,ease);
  anim(hl2,
    {opacity:'0',transform:'translateY('+dy+'px)',clipPath:'inset(100% 0 0 0)'},
    toClip,330,760,ease);
  anim(h1,{opacity:'0',transform:'translateY(10px)'},to,470,620,ease);
  anim(sub,{opacity:'0',transform:'translateY(10px)'},to,570,560,ease);
  anim(email,{opacity:'0',transform:'translateY(8px)'},to,720,520,softEase);
  anim(pw,{opacity:'0',transform:'translateY(8px)'},to,790,520,softEase);
  anim(loginBtn,{opacity:'0',transform:'translateY(8px)'},to,930,560,ease);
  anim(divider,{opacity:'0',transform:'translateY(6px)'},to,1060,440,softEase);
  anim(gBtn,{opacity:'0',transform:'translateY(8px)'},to,1150,540,ease);
  anim(bottom,{opacity:'0',transform:'translateY(6px)'},to,1260,500,softEase);

  Promise.allSettled(animations.map(function(a){return a.finished;}))
    .then(releaseEntrance);
}

Promise.race([
  document.fonts.ready,
  new Promise(function(r){setTimeout(r,650);})
]).then(function(){
  requestAnimationFrame(function(){
    requestAnimationFrame(start);
  });
});
})();
</script>
